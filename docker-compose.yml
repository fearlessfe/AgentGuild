services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: agentguild
      POSTGRES_USER: agentguild
      POSTGRES_PASSWORD: agentguild
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguild -d agentguild"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
