services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: agentguild
      POSTGRES_USER: agentguild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguild -d agentguild"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://agentguild:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/agentguild?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    environment:
      DATABASE_URL: postgres://agentguild:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/agentguild?sslmode=disable
      CURSOR_SECRET: ${CURSOR_SECRET:?set CURSOR_SECRET in .env}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:?set SESSION_COOKIE_SECRET in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?set LOCAL_ADMIN_PASSWORD in .env}
      LOCAL_ADMIN_TENANT_ID: ${LOCAL_ADMIN_TENANT_ID:-local}
      LOCAL_ADMIN_OWNER_ID: ${LOCAL_ADMIN_OWNER_ID:-local-admin}
      LOCAL_ADMIN_OWNER_EMAIL: ${LOCAL_ADMIN_OWNER_EMAIL:-admin@local}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://agentguild.local}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-agentguild}
      WEB_ENABLED: "true"
      MCP_ENABLED: "true"
      HTTP_ADDR: :8080
      AGENT_RSA_PRIVATE_KEY_PATH: /var/lib/agentguild/agent-rsa.pem
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - agentguild-keys:/var/lib/agentguild
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  agentguild-keys:
