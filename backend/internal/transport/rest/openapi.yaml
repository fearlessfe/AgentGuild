components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.1 Agent Access Token
    sessionCookie:
      type: apiKey
      in: cookie
      name: agentguild_session
      description: 人类管理端 OIDC session cookie

  parameters:
    ExecutionId:
      name: id
      in: path
      required: true
      description: Tenant-scoped Execution ID
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        写操作的持久幂等键。相同 tenant、human owner、operation、key 与规范请求会重放首次完成的原始 HTTP status/body；
        相同 key 用于不同请求返回 409 IDEMPOTENCY_MISMATCH，仍在处理的请求返回 409 IDEMPOTENCY_IN_PROGRESS。
      schema:
        type: string
        minLength: 1
    AgentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    VersionID:
      name: version_id
      in: path
      required: true
      description: Tenant-scoped Agent Version ID
      schema:
        type: string
        minLength: 1
    ExperienceID:
      name: experience_id
      in: path
      required: true
      description: Tenant-scoped Experience Candidate ID
      schema:
        type: string
        minLength: 1

  schemas:
    Meta:
      type: object
      properties:
        server_time:
          type: string
          format: date-time
        resource_version:
          type: integer
          format: int64
        poll_after_seconds:
          type: integer
        next_cursor:
          type: string
          nullable: true

    GitHubAppPublicView:
      type: object
      description: GitHub App public view；不会包含 private_key、webhook_secret 或 client_secret。
      properties:
        id:
          type: string
          description: Tenant-scoped GitHub App ID
        tenant_id:
          type: string
        provider:
          type: string
        app_id:
          type: integer
          format: int64
        installation_id:
          type: integer
          format: int64
        base_url:
          type: string
        app_slug:
          type: string
        installation_account_login:
          type: string
          description: GitHub installation account login returned by GitHub
        is_default:
          type: boolean
          description: Whether singular compatibility routes select this App
        configured:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GitHubAppItems:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GitHubAppPublicView'

    GitHubAppConnectionTest:
      type: object
      required:
        - ok
        - repo_count
      properties:
        ok:
          type: boolean
        repo_count:
          type: integer
          minimum: 0
        error:
          type: string
          description: Stable, redacted error message when ok is false

    RepositoryItem:
      type: object
      properties:
        id:
          type: string
          description: 已 onboarded 仓库 ID；GitHub App candidate item 中为空
        source_type:
          type: string
          description: 已 onboarded 仓库来源；GitHub App candidate item 中为空
          enum:
            - github_app
            - public_github
        github_app_id:
          type: string
          description: GitHub App 来源仓库绑定的 tenant-scoped App ID；public 仓库中为空
        full_name:
          type: string
          example: agentguild/agentguild
        default_branch:
          type: string
          example: main
        visibility:
          type: string
          example: public
        created_at:
