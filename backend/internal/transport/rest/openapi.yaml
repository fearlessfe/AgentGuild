    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
            violations:
              type: array
              description: 结构化违规明细（如 changed_paths 越界时返回具体路径与原因），无违规时缺省
              items:
                type: object
                properties:
                  path:
                    type: string
                  reason:
                    type: string

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: 未提供或验证失败的身份凭证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: 主体无权访问该资源（仅管理员可见）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 资源不存在或无权限（非管理员统一响应）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: 状态冲突、租约过期或幂等键冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    RateLimited:
      description: 请求被限流
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceUnavailable:
      description: 依赖能力暂不可用（如评测执行器未配置 EVALUATION_UNAVAILABLE、下游调用超时 TEMPORARILY_UNAVAILABLE）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: 内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
