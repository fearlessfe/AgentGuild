        reason:
          type: string

    RejectExperienceResult:
      type: object
      properties:
        rejected:
          type: boolean

    ThresholdResult:
      type: object
      properties:
        name:
          type: string
        passed:
          type: boolean
        evidence:
          type: object
          additionalProperties: true

    EvaluationRunResult:
      type: object
      description: 单个基准任务在评测运行中的结果
      properties:
        evaluation_run_id:
          type: string
        tenant_id:
          type: string
        task_ref:
          type: string
          description: 基准集内的任务引用
        score:
          type: number
        passed:
          type: boolean
        details:
          type: object
          additionalProperties: true
          description: 结果明细；platform 执行器下包含 resolution（收割结论）等证据

    EvaluationSummary:
      type: object
      properties:
        pass_rate:
          type: number
        avg_latency_ms:
          type: number
        cost_cents:
          type: integer
          format: int64
        security_passed:
          type: boolean
        executor:
          type: string
          description: 产生证据的评测执行器标识；fixed-stub 表示开发用固定通过 stub
        extra:
          type: object
          additionalProperties: true

    EvaluationRunDetail:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        agent_version_id:
          type: string
        benchmark_set_id:
          type: string
        status:
          $ref: '#/components/schemas/EvaluationRunStatus'
        environment_digest:
          type: string
        scoring_rule_version:
          type: string
        threshold_results:
          type: array
          items:
            $ref: '#/components/schemas/ThresholdResult'
        summary:
          $ref: '#/components/schemas/EvaluationSummary'
        task_results:
          type: array
          description: 各基准任务的评测结果；运行完成前为空
          items:
            $ref: '#/components/schemas/EvaluationRunResult'
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    EvaluationRunPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationRunDetail'

    BenchmarkSetSummary:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        version_number:
          type: integer
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    BenchmarkSetPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkSetSummary'

    CreateBenchmarkSetRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tasks:
          type: array
          description: 有序任务列表；元素为任务引用字符串（旧形式）或完整任务定义对象
          items:
            oneOf:
              - type: string
              - type: object
                required:
                  - task_ref
                properties:
                  task_ref:
                    type: string
                    description: 基准集内唯一的任务引用
                  title:
                    type: string
                    description: 发布为平台任务时使用的任务标题
                  problem:
                    type: string
                    description: 发布为平台任务时使用的任务问题描述
                  constraints:
                    type: array
                    description: 任务约束；platform 执行器会追加 eval_run 约束
                    items:
                      type: string
                  requirements:
                    type: array
                    description: 任务验收要求
                    items:
                      type: string
                  is_security:
                    type: boolean
                    description: 是否安全类任务；用于安全通过率硬门槛
        is_active:
          type: boolean
          description: 为 true 时原子替换当前 tenant 生效基准集

    CreateBenchmarkSetResponse:
      type: object
      properties:
        benchmark_set_id:
          type: string
        version_number:
          type: integer

    SyncRule:
      type: object
      properties:
        id:
          type: string
        repo:
          type: string
          example: agentguild/agentguild
        include_labels:
          type: array
          items:
            type: string
        exclude_labels:
          type: array
          items:
            type: string
        issue_state:
          type: string
          enum:
            - open
            - closed
            - all
        task_type:
          type: string
        default_priority:
          type: string
        dedupe_strategy:
          type: string
          enum:
            - update
            - skip
        source_auth:
          type: string
          enum:
            - app
            - public
        enabled:
          type: boolean
        last_synced_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SyncRuleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncRule'

    SyncRuleRequest:
      type: object
      required:
        - repo
        - issue_state
        - task_type
        - dedupe_strategy
      properties:
        repo:
          type: string
          description: GitHub 仓库 full name
          example: agentguild/agentguild
        include_labels:
          type: array
          items:
            type: string
        exclude_labels:
          type: array
          items:
            type: string
        issue_state:
          type: string
          enum:
            - open
            - closed
            - all
        task_type:
          type: string
        default_priority:
          type: string
        dedupe_strategy:
          type: string
          enum:
            - update
            - skip
        source_auth:
          type: string
          description: Issue 读取凭证来源；缺省为 app
          enum:
            - app
            - public
        enabled:
          type: boolean

    SyncResultSummary:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        cancelled:
          type: integer
        failed:
          type: integer

    InstallationRepository:
      type: object
      properties:
        full_name:
          type: string
          example: agentguild/agentguild
        default_branch:
          type: string
          example: main
        visibility:
          type: string
          example: public

    InstallationRepositoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InstallationRepository'

    UpsertGitHubAppRequest:
      type: object
      properties:
        provider:
          type: string
        app_id:
          type: integer
          format: int64
        installation_id:
          type: integer
          format: int64
        private_key:
          type: string
          description: GitHub App private key PEM；只在请求中上行，永不出现在任何响应中
        base_url:
          type: string
          description: GitHub/GHE API base URL；缺省 https://api.github.com

    RubricDimension:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Rubric:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        version_number:
          type: integer
        name:
          type: string
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/RubricDimension'
        weights:
          type: object
          additionalProperties:
            type: number
        algorithm_version:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    EnvelopeVersionPage:
